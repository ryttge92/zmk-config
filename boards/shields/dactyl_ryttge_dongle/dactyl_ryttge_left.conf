CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Decrease chatter; increase latency, but increase stability
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# PIM447 trackball (https://github.com/michaelcoquet/zmk-driver-pim447)
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PIM447=y
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=1

# Debug Logging
#CONFIG_LOG=y
#CONFIG_ZMK_USB_LOGGING=y
#CONFIG_PIM447_LOG_LEVEL_DBG=y
