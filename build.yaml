# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
# Without Dongle
include:
  - board: nice_nano
    shield: dactyl_manuform_5x7_sa_left
  - board: nice_nano
    shield: dactyl_manuform_5x7_sa_right
    #snippet: zmk-usb-logging
    #snippet: zmk-usb-logging studio-rpc-usb-uart
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  #- board: nice_nano # Replace with the Pro Micro-compatible board you're using
  #  shield: tester_pro_micro

# Dongle

  - board: seeeduino_xiao_ble
    shield: dactyl_manuform_5x7_dongle dongle_screen
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano
    shield: dactyl_manuform_5x7_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano
    shield: dactyl_manuform_5x7_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  #Charybdis

  - board: seeeduino_xiao_ble
    shield: charybdis_dongle dongle_screen
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano
    shield: charybdis_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano
    shield: charybdis_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  #Dactyl-Ryttge

  - board: seeeduino_xiao_ble
    shield: dactyl_ryttge_dongle dongle_screen
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano
    shield: dactyl_ryttge_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano
    shield: dactyl_ryttge_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # Dactyl-Ryttge halves with USB logging, for trackball debugging
  - board: nice_nano
    shield: dactyl_ryttge_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_PIM447_LOG_LEVEL_DBG=y
    artifact-name: dactyl_ryttge_left_logging
  - board: nice_nano
    shield: dactyl_ryttge_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: dactyl_ryttge_right_logging

  #test
    
  - board: nice_nano
    shield: settings_reset
  - board: seeeduino_xiao_ble
    shield: settings_reset